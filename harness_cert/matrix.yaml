# Harness certification matrix (STEP 0).
#
# status vocabulary (only these): PASS | FAIL | VERSION-SPECIFIC | HOST-UNKNOWN | NOT-REPRODUCED | DEFERRED
# Nothing here has been runtime-tested yet. Initial statuses are deliberately NOT PASS.
#
# Field semantics:
#   local_possible   - can run on the M1 Mac (no GPU) once the harness packages are available locally.
#   requires_model   - needs the real Gemma 4 31B (or a real Gemma chat template/parser), not a scripted mock.
#   blocked_by       - what currently prevents running it. `harness_source` = swegemma / adk-submission /
#                      adk-eval-core / google-adk / litellm are NOT in $GEMMA4_DATASET_ROOT/wheels (see H23).
#   result_path      - raw output dir (gitignored, never committable); curated summaries go to harness_cert/reports/.
#   "scripted mock"  - a local OpenAI-compatible stub server that returns predetermined tool calls and records
#                      every request body. It exercises ADK -> LiteLLM -> tool -> serialization without a model.
#
# authority labels: source hierarchy (OFFICIAL-RULE, OFFICIAL-HARNESS, OFFICIAL-NOTEBOOK, REPRODUCED-LOCAL,
#                   OWN-KAGGLE-RUN, COMMUNITY-EVIDENCE, INFERENCE). Evidence classes for audit conclusions are in
#                   docs/competition/STATIC_HARNESS_AUDIT.md.

schema_version: 1
status_vocabulary: [PASS, FAIL, VERSION-SPECIFIC, HOST-UNKNOWN, NOT-REPRODUCED, DEFERRED]

items:
  - id: H01
    title: reasoning_content continuity across tool calls
    hypothesis: Prior-turn reasoning sent by ADK/LiteLLM as `reasoning_content` is dropped by the pinned vLLM, which reads only `reasoning`.
    authority:
      - "COMMUNITY-EVIDENCE (forum C02)"
      - "INFERENCE (upstream vLLM #38488 / PR #42664 merged 2026-05-21; Kaggle pin unknown)"
    local_possible: false
    requires_model: true
    requires_gpu: true
    requires_docker: false
    blocked_by: [harness_source, gpu, vllm_version_unknown]
    risk: high
    status: NOT-REPRODUCED
    result_path: harness_cert/results/H01/
    minimal_repro: >-
      Partial local step (scripted mock): capture the 2nd request body after a tool call and record which key
      (reasoning_content / reasoning / none) carries the prior thought. Full step (GPU, exact vLLM): plant a sentinel
      in thought, then check the tokenized prompt of the next request for the sentinel.
    notes: Request-side half is mock-testable once harness_source is available; consumption side needs the exact vLLM build.

