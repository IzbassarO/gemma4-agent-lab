      - "COMMUNITY-EVIDENCE (C01, adk_submission 0.2.12)"
    local_possible: true
    requires_model: false
    requires_gpu: false
    requires_docker: false
    blocked_by: [harness_source]
    risk: high
    status: NOT-REPRODUCED
    result_path: harness_cert/results/H02/
    minimal_repro: >-
      Compile two copies of a 1-agent bundle (include_thoughts true/false) against the scripted mock and diff the
      outgoing request bodies (extra_body / chat_template_kwargs / reasoning_effort). Generation-side effect needs GPU.
    notes: README itself already says include_thoughts:false disables thinking; the "private reasoning" claim in older notebooks contradicts the README.

